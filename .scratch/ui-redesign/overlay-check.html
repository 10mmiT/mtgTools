<!DOCTYPE html>
<html data-theme="contrast">
<head>
<meta charset="utf-8">
<title>Overlay edge check</title>
<link rel="stylesheet" href="../../public/css/tokens.css">
<link rel="stylesheet" href="../../public/css/base.css">
<link rel="stylesheet" href="../../public/css/layout.css">
<link rel="stylesheet" href="../../public/css/components.css">
<link rel="stylesheet" href="../../public/css/tabs.css">
</head>
<body style="padding:var(--space-6)">
  <!-- Overlays carry a shadow and no border. This page exists to check that
       they still have a visible edge on the pure-black contrast theme, where
       a black shadow over a black page cannot supply one. -->
  <div class="section-title">Dropdown menu (.col-menu)</div>
  <div style="position:relative;height:150px">
    <div class="col-menu open" style="position:static;display:inline-block">
      <label class="col-menu-item"><input type="checkbox" checked> Card Name</label>
      <label class="col-menu-item"><input type="checkbox"> Set</label>
      <label class="col-menu-item"><input type="checkbox"> Price</label>
    </div>
  </div>

  <div class="section-title">Autocomplete (.ac-dropdown)</div>
  <div style="position:relative;height:130px;width:320px">
    <div class="ac-dropdown" style="display:block;position:static">
      <div class="ac-item">Lightning Bolt</div>
      <div class="ac-item">Lightning Helix</div>
      <div class="ac-item">Lightning Greaves</div>
    </div>
  </div>

  <div class="section-title">Modal (.card-modal-box)</div>
  <div class="card-modal-box" style="max-width:420px">
    <div class="card-detail-name">Sol Ring</div>
    <div class="card-oracle">Add two colorless mana.</div>
  </div>

  <div class="section-title">Lifted tile (.grid-card:hover uses --shadow-lift)</div>
  <div style="width:160px;box-shadow:var(--shadow-lift);background:var(--surface-2);border-radius:var(--radius-md);padding:var(--space-4)">
    <div class="grid-name">A lifted card tile</div>
  </div>
</body>
</html>
